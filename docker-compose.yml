version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnquest
      POSTGRES_PASSWORD: learnquest
      POSTGRES_DB: learnquest
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      USER_SVC_URL: http://user-svc:3002
      GAME_SVC_URL: http://game-svc:3003
      ABOA_SVC_URL: http://aboa-svc:3004
      ANALYTICS_SVC_URL: http://analytics-svc:3005
      RT_SVC_URL: http://rt-svc:3006
      AI_SVC_URL: http://ai-svc:3007
    depends_on: [user-svc, game-svc, aboa-svc, analytics-svc, rt-svc, ai-svc]

  user-svc:
    build: ./user-svc
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
    depends_on: [postgres]

  game-svc:
    build: ./game-svc
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
      ABOA_SVC_URL: http://aboa-svc:3004
      USER_SVC_URL: http://user-svc:3002
      AI_SVC_URL: http://ai-svc:3007
    depends_on: [postgres, aboa-svc, user-svc, ai-svc]

  aboa-svc:
    build: ./aboa-svc
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
    depends_on: [postgres]

  analytics-svc:
    build: ./analytics-svc
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
    depends_on: [postgres]

  rt-svc:
    build: ./rt-svc
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      NODE_ENV: production
      CLERK_ISSUER: ${CLERK_ISSUER}

  ai-svc:
    build: ./ai-svc
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      NODE_ENV: production
      PORT: 3007
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

  student-app:
    build: ./student-app
    restart: unless-stopped
    ports:
      - '5173:80'

volumes:
  pg_data:
