version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnquest
      POSTGRES_PASSWORD: learnquest
      POSTGRES_DB: learnquest
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      AUTH_SVC_URL: http://auth-svc:3001
      USER_SVC_URL: http://user-svc:3002
      GAME_SVC_URL: http://game-svc:3003
      ABOA_SVC_URL: http://aboa-svc:3004
      ANALYTICS_SVC_URL: http://analytics-svc:3005
      RT_SVC_URL: http://rt-svc:3006
    depends_on: [auth-svc, user-svc, game-svc, aboa-svc, analytics-svc, rt-svc]

  auth-svc:
    build: ./auth-svc
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
      JWT_SECRET: ${JWT_SECRET:-supersecret}
    depends_on: [postgres]

  user-svc:
    build: ./user-svc
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
      JWT_SECRET: ${JWT_SECRET:-supersecret}
    depends_on: [postgres]

  game-svc:
    build: ./game-svc
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
      ABOA_SVC_URL: http://aboa-svc:3004
      USER_SVC_URL: http://user-svc:3002
      JWT_SECRET: ${JWT_SECRET:-supersecret}
    depends_on: [postgres, aboa-svc, user-svc]

  aboa-svc:
    build: ./aboa-svc
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
    depends_on: [postgres]

  analytics-svc:
    build: ./analytics-svc
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://learnquest:learnquest@postgres:5432/learnquest
    depends_on: [postgres]

  rt-svc:
    build: ./rt-svc
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      NODE_ENV: production
      PORT: 3006
      JWT_SECRET: ${JWT_SECRET:-supersecret}

  student-app:
    build: ./student-app
    restart: unless-stopped
    ports:
      - '5173:80'

  educator-app:
    build: ./educator-app
    restart: unless-stopped
    ports:
      - '5174:80'

volumes:
  pg_data:
